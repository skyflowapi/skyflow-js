name: FlowVault Public Release

# Production release entry point for skyflow-flowvault-js (flowDB). Triggered by
# a flowvault-namespaced release tag. The '!...-beta*' negation guard ensures a
# beta tag (flowvault-v1.0.0-beta.3) does NOT also fire this prod workflow —
# only clean release tags (flowvault-v1.0.0) do. Lands in the SAME prod bucket +
# CloudFront distribution as skyflow-js, under the flowvault/ prefix.
on:
  push:
    tags:
      - 'flowvault-v*'
      - '!flowvault-v*-beta*'
    paths-ignore:
      - "package.json"
      - "package-lock.json"
      - "*.md"


jobs:
  flowvault-public-release:
    uses: ./.github/workflows/common-release.yml
    with:
      REGISTRY_URL: "https://registry.npmjs.org"
      TAG: "public"
      PACKAGE_DIR: "packages/skyflow-flowvault-js"
      PACKAGE_NAME: "skyflow-flowvault-js"
      DIST_DIR: "packages/skyflow-flowvault-js/dist/v1"
      S3_PREFIX: "flowvault/"
      TAG_PREFIX: "flowvault-"
      INVALIDATION_PATH: "/*"
    secrets:
      # Same prod bucket / distribution / CDN origin as skyflow-js — flowDB just
      # lands under the flowvault/ key prefix, so the shared PROD_* secrets are
      IFRAME_SECURE_ORIGIN: ${{ secrets.PROD_IFRAME_SECURE_ORIGIN }}
      IFRAME_SECURE_SITE: ${{ secrets.PROD_IFRAME_SECURE_SITE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_ACCESS_KEY_SECRET }}
      AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
      AWS_BUCKET_NAME: ${{ secrets.PROD_AWS_BUCKET_NAME }}
      CF_DISTRIBUTION_ID: ${{ secrets.PROD_CF_DISTRIBUTION_ID }}
      PAT_ACTIONS: ${{ secrets.PAT_ACTIONS }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
